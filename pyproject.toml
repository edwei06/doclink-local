[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doclink-local"
version = "0.1.0"
description = "Offline Markdown file and asset link validation using CommonMark parsing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "edwei06"}]
dependencies = ["markdown-it-py>=3,<5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
doclink-local = "doclink_local.cli:main"

[tool.setuptools.packages.find]
include = ["doclink_local*"]
